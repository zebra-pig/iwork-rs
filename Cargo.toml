[package]
name = "iwork"
version = "0.2.0"
edition = "2021"
rust-version = "1.74"
description = "Read and write Apple iWork documents (Pages, Numbers, Keynote)"
license = "MIT"
repository = "https://github.com/zebra-pig/iwork-rs"
keywords = ["pages", "numbers", "keynote", "iwork", "iwa"]
categories = ["parser-implementations", "filesystem"]
readme = "README.md"
documentation = "https://docs.rs/iwork"
# The corpus is generated by `scripts/make-fixtures.sh` and never committed, and
# the reference material is not ours to ship — see README §Legal.
exclude = ["tests/fixtures/", "reference/", "target/"]

[package.metadata.docs.rs]
# The crate documents a format; the module tour is the way in.
all-features = true

[dependencies]
snap = "1.1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[[bin]]
name = "iwork"
path = "src/bin/iwork.rs"

[package]
name = "iwork"
version = "0.2.1"
edition = "2021"
rust-version = "1.74"
description = "Read and write Apple iWork documents (Pages, Numbers, Keynote)"
license = "MIT"
repository = "https://github.com/zebra-pig/iwork-rs"
keywords = ["pages", "numbers", "keynote", "iwork", "iwa"]
categories = ["parser-implementations", "encoding"]
readme = "README.md"
documentation = "https://docs.rs/iwork"
# The corpus is generated by `scripts/make-fixtures.sh` and never committed, and
# the reference material is not ours to ship — see README §Legal. The scripts
# themselves all drive that corpus, so they are no use to anyone downloading
# this from crates.io; they stay in the repository. `PLAN.md` is the working
# journal and the ground rules a contributor works under — 230K nothing in the
# package links to. `FORMAT.md` is the specification, and does ship.
exclude = ["tests/fixtures/", "reference/", "scripts/", "target/", "PLAN.md"]

[package.metadata.docs.rs]
# The crate documents a format; the module tour is the way in.
all-features = true

[dependencies]
snap = "1.1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[[bin]]
name = "iwork"
path = "src/bin/iwork.rs"
